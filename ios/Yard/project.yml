name: Yard

options:
  bundleIdPrefix: com.santinomarial
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGN_STYLE: Automatic

targets:
  Yard:
    type: application
    platform: iOS
    sources:
      - path: Yard
        excludes:
          - Resources/Info.plist
    resources:
      - path: Yard/Resources/Assets.xcassets
    info:
      path: Yard/Resources/Info.plist
      properties:
        CFBundleDisplayName: Yard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Yard uses the camera to photograph items you choose to list.
        NSPhotoLibraryUsageDescription: Yard lets you select item photos for listings.
        NSLocationWhenInUseUsageDescription: Yard uses your location only to estimate travel time to a selected public pickup area.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        YARD_API_BASE_URL: http://localhost:8000
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santinomarial.yard
        PRODUCT_NAME: Yard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - YardTests
      gatherCoverageData: true

  YardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YardTests
    dependencies:
      - target: Yard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santinomarial.yard.tests
        GENERATE_INFOPLIST_FILE: true

