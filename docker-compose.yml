name: yard

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: yard
      POSTGRES_USER: yard
      POSTGRES_PASSWORD: yard
    ports:
      - "5432:5432"
    volumes:
      - yard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yard -d yard"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - yard_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: yard
      MINIO_ROOT_PASSWORD: yard-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yard_minio:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    environment:
      YARD_ENVIRONMENT: development
      YARD_DATABASE_URL: postgresql+asyncpg://yard:yard@postgres:5432/yard
      YARD_REDIS_URL: redis://redis:6379/0
      RUFF_CACHE_DIR: /tmp/yard-ruff-cache
      MYPY_CACHE_DIR: /tmp/yard-mypy-cache
      PYTEST_ADDOPTS: -p no:cacheprovider
    command:
      - sh
      - -c
      - alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_YARD_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  yard_postgres:
  yard_redis:
  yard_minio:
