[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yard-api"
version = "0.1.0"
description = "Yard marketplace API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "botocore>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx[http2]>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the PostgreSQL development service"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"] # FastAPI dependency declarations intentionally call Depends/Query.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
cache_dir = "/tmp/yard-mypy-cache"
